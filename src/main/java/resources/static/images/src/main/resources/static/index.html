<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cars Inventory</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header class="hero"><div><p class="eyebrow">DEALERSHIP DASHBOARD</p><h1>Find your next drive.</h1><p>Explore detailed vehicle information and manage your showroom inventory in one place.</p><a href="#inventory">Browse collection</a></div><img src="images/showroom-sedan.png" alt="Blue executive sedan in a bright showroom" /></header>
    <section class="stats"><article><span>Cars in stock</span><strong id="car-count">0</strong></article><article><span>Total value</span><strong id="total-value">$0</strong></article></section>
    <section class="panel" id="inventory">
      <div class="toolbar"><h2>Available cars</h2><input id="search" placeholder="Search make or model..." /></div>
      <div id="cars" class="car-grid"></div>
    </section>
    <section class="panel"><h2>Add a car</h2><form id="car-form"><input name="id" placeholder="ID e.g. C003" required /><input name="make" placeholder="Make" required /><input name="model" placeholder="Model" required /><input name="year" type="number" min="1886" placeholder="Year" required /><input name="price" type="number" min="0" step="0.01" placeholder="Price" required /><input name="fuelType" placeholder="Fuel type" value="Petrol" required /><input name="transmission" placeholder="Transmission" value="Automatic" required /><input name="mileage" type="number" min="0" placeholder="Mileage (km)" value="0" required /><input name="color" placeholder="Colour" required /><input name="imageUrl" placeholder="Image URL (optional)" /><button>Add car</button></form><p id="message" role="status"></p></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
